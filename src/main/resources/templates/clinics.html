<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clinics')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar('clinics')}"></aside>

  <main class="main">
    <div class="content">
      <header class="page-header">
        <div>
          <p class="eyebrow">Logistics</p>
          <h1>Clinics</h1>
          <p class="subtitle" th:text="${#lists.size(clinics)} + ' vaccination sites'">6 vaccination sites</p>
        </div>
        <div class="header-actions">
          <label th:replace="~{fragments/layout :: search('#clinic-grid', 'Search clinics')}"></label>
          <button class="btn btn-primary" type="button" data-open-dialog="#clinic-dialog">
            <th:block th:replace="~{fragments/icons :: icon('plus')}"/>Add clinic</button>
        </div>
      </header>

      <section class="clinic-grid" id="clinic-grid" aria-label="Clinic directory">
        <article class="card clinic-card" th:each="o : ${clinics}" th:with="c=${o.clinic}" data-filter-item>
          <div class="card-body">
            <div class="clinic-head">
              <div class="cell-stack">
                <h3 th:text="${c.name}">Rexall</h3>
                <span class="sub" th:text="${c.city} + ', ' + ${c.prov}">Kingston, ON</span>
              </div>
              <form method="post" th:action="@{/clinics/{name}/delete(name=${c.name})}"
                    th:attr="data-confirm='Remove ' + ${c.name} + '? Staff assignments and shipments for this clinic are removed too.'">
                <button class="btn btn-icon" type="submit" th:attr="aria-label='Delete ' + ${c.name}" th:title="'Delete ' + ${c.name}">
                  <th:block th:replace="~{fragments/icons :: icon('trash')}"/></button>
              </form>
            </div>
            <p class="meta-line">
              <th:block th:replace="~{fragments/icons :: icon('pin')}"/>
              <span th:text="${c.street} + ', ' + ${c.pc}">240 Montreal St, K7K 3G8</span>
            </p>
            <p class="meta-line">
              <th:block th:replace="~{fragments/icons :: icon('calendar')}"/>
              <span th:text="'Operating ' + ${@dates.pretty(c.operatingDate)}">Operating Jun 17, 2021</span>
            </p>
            <div class="chips">
              <span class="chip" th:each="lot : ${o.lots}" th:text="${lot}">CD2345</span>
              <span class="badge warning" th:if="${#lists.isEmpty(o.lots)}">No vaccine supply</span>
            </div>
          </div>
          <div class="clinic-stats">
            <div><strong th:text="${#lists.size(o.lots)}">1</strong><span>Lots</span></div>
            <div><strong th:text="${o.staff}">2</strong><span>Staff</span></div>
            <div><strong th:text="${o.vaccinations}">1</strong><span>Doses given</span></div>
          </div>
        </article>
      </section>
      <div class="card empty" th:if="${#lists.isEmpty(clinics)}"><strong>No clinics yet</strong>Add your first vaccination site.</div>
      <div class="card empty" hidden data-filter-empty="#clinic-grid"><strong>No matching clinics</strong>Try another name or city.</div>
    </div>
  </main>
</div>

<dialog class="modal" id="clinic-dialog" aria-labelledby="clinic-dialog-title"
        th:attr="data-auto-open=${openDialog == 'clinic-dialog'} ? 'true' : null">
  <form method="post" th:action="@{/clinics}" th:object="${clinicForm}">
    <div class="modal-header">
      <div>
        <h2 id="clinic-dialog-title">Add clinic</h2>
        <p>Open a new vaccination site.</p>
      </div>
      <button type="button" class="btn btn-icon" data-close-dialog aria-label="Close">
        <th:block th:replace="~{fragments/icons :: icon('x')}"/></button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field full">
          <label for="name">Clinic name</label>
          <input th:field="*{name}" th:errorclass="invalid" maxlength="30" required>
          <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div class="field full">
          <label for="street">Street</label>
          <input th:field="*{street}" th:errorclass="invalid" maxlength="30" required>
          <p class="field-error" th:if="${#fields.hasErrors('street')}" th:errors="*{street}"></p>
        </div>
        <div class="field">
          <label for="city">City</label>
          <input th:field="*{city}" th:errorclass="invalid" maxlength="30" required>
          <p class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></p>
        </div>
        <div class="field">
          <label for="prov">Province</label>
          <input th:field="*{prov}" th:errorclass="invalid" maxlength="30" placeholder="ON" required>
          <p class="field-error" th:if="${#fields.hasErrors('prov')}" th:errors="*{prov}"></p>
        </div>
        <div class="field">
          <label for="pc">Postal code</label>
          <input th:field="*{pc}" th:errorclass="invalid" maxlength="30" placeholder="K7L 1A1" required>
          <p class="field-error" th:if="${#fields.hasErrors('pc')}" th:errors="*{pc}"></p>
        </div>
        <div class="field">
          <label for="operatingDate">Operating date</label>
          <input type="date" th:field="*{operatingDate}" th:errorclass="invalid" required>
          <p class="field-error" th:if="${#fields.hasErrors('operatingDate')}" th:errors="*{operatingDate}"></p>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" data-close-dialog>Cancel</button>
      <button type="submit" class="btn btn-primary">Create clinic</button>
    </div>
  </form>
</dialog>

<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>
