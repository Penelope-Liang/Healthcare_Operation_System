<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Stroke icons (24px grid, Lucide-style). Usage: th:replace="~{fragments/icons :: icon('users')}" -->
<svg th:fragment="icon(name)" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  <th:block th:switch="${name}">
    <th:block th:case="'dashboard'"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></th:block>
    <th:block th:case="'users'"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></th:block>
    <th:block th:case="'syringe'"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/></th:block>
    <th:block th:case="'package'"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></th:block>
    <th:block th:case="'building'"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></th:block>
    <th:block th:case="'stethoscope'"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 12 0V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 12 0v-4"/><circle cx="20" cy="10" r="2"/></th:block>
    <th:block th:case="'plus'"><path d="M5 12h14M12 5v14"/></th:block>
    <th:block th:case="'search'"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></th:block>
    <th:block th:case="'trash'"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></th:block>
    <th:block th:case="'x'"><path d="M18 6 6 18M6 6l12 12"/></th:block>
    <th:block th:case="'truck'"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></th:block>
    <th:block th:case="'pin'"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></th:block>
    <th:block th:case="'calendar'"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></th:block>
    <th:block th:case="'clock'"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></th:block>
    <th:block th:case="'shield'"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></th:block>
    <th:block th:case="'activity'"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></th:block>
    <th:block th:case="'database'"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></th:block>
    <th:block th:case="'arrow-right'"><path d="M5 12h14M13 6l6 6-6 6"/></th:block>
    <th:block th:case="'check'"><path d="M20 6 9 17l-5-5"/></th:block>
    <th:block th:case="'alert'"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></th:block>
    <th:block th:case="'code'"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></th:block>
  </th:block>
</svg>
</body>
</html>
