# "demo" profile: an in-memory H2 database in MySQL mode, created from database/schema.sql and
# database/seed.sql (copied into the jar at build time). Runs the app and the tests without MySQL.
spring:
  datasource:
    url: jdbc:h2:mem:healthops;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql
