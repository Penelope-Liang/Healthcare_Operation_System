# "demo" profile: an in-memory H2 database in MySQL mode, seeded with the same sample data
# as database/covidDB.sql. Lets you run the app (and the tests) without installing MySQL.
spring:
  datasource:
    url: jdbc:h2:mem:covidDB;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
