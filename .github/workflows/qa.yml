name: QA Automation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: healthops

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Build Vue frontend + Spring Boot jar, run JUnit / MockMvc tests and check coverage
        run: mvn -B verify

      - name: Write coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
              END {
                printf "### Java test coverage (JaCoCo)\n\n| Metric | Coverage |\n| --- | --- |\n"
                printf "| Lines | %.1f%% (%d of %d) |\n", 100 * lc / (lc + lm), lc, lc + lm
                printf "| Branches | %.1f%% (%d of %d) |\n", 100 * bc / (bc + bm), bc, bc + bm
              }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Run Vitest frontend unit tests
        run: npm --prefix frontend test

      - name: Create MySQL database from schema and seed data
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -u root -e "CREATE DATABASE healthops"
          mysql --protocol=tcp -h 127.0.0.1 -u root healthops < database/schema.sql
          mysql --protocol=tcp -h 127.0.0.1 -u root healthops < database/seed.sql

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UI and API tests against MySQL
        run: npm run test:e2e
        env:
          SPRING_PROFILES_ACTIVE: default

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
